name: Sync OneDrive Sales Data

on:
  schedule:
    # Berjalan otomatis setiap jam
    - cron: '0 * * * *'
  workflow_dispatch: # Memungkinkan trigger manual dari tab Actions di GitHub

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download & Parse OneDrive Data
        env:
          ONEDRIVE_URL: ${{ secrets.ONEDRIVE_DIRECT_URL }}
        run: |
          python sync_onedrive.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json salespersonwise.xls
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update sales data from OneDrive [skip ci]" && git push)
